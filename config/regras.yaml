geral:
  buffer_producao_pct: 5
  arredondamento: "ceil"        # "ceil" = sempre arredonda pra cima; era "UP" (alias inválido)
  tolerancia_match_qtd_pct: 15  # aumentado: 5% era muito restrito para OFs sem vínculo direto via API
  semanas_antes_entrega_cliente: 2
  semanas_autonomia_pcp: 3
  permitir_consumir_margem: true
  horizonte_sinalizacao_dias: 90
  estrategia_cronograma: "jit"  # jit = backward scheduling (terminar o mais tarde possível dentro da janela)

capacidade:
  limite_total_semana: 80000
  semanas_ausentes_sao_zero: true
  ociosidade_alerta_pct: 40
  # Clientes de Magazines confirmados a partir do relatório oficial de facção do PCP:
  # 00000: Papinha Baby (Interno), 09988: C&A, 31019: Riachuelo, 35980: Renner/Youcom
  codcli_magazines: ["00000", "09988", "31019", "35980"]

fases_dias:
  PCP_MIN: 2
  PCP_PADRAO: 15
  ENCAIXE: 1
  CORTE: 4
  ENTRETELA: 2
  QUAL_ENTRETELA: 1
  COSTURA: 11
  QUAL_COSTURA: 1
  CASEADO_BOTAO: 3
  ESTAMPARIA: 5
  ESTAMPARIA_NUCA: 4
  QUAL_ESTAMPARIA: 1
  CQ: 1
  QUAL_APLIQUE: 1
  APLIQUE: 8
  LAVANDERIA: 10
  QUAL_LAVANDERIA: 1
  ACAB_COST: 4
  QUAL: 1
  PASSADORIA: 4
  REVISAO: 6
  EMBALAGEM: 4

lead_times_estoque_futuro_dias:
  compra: 7
  tecelagem: 7
  tinturaria: 14
  pend_tinturaria: 14

rotas:
  DEFAULT: [PCP, ENCAIXE, CORTE, COSTURA, QUAL_COSTURA, ESTAMPARIA_NUCA, QUAL_ESTAMPARIA, REVISAO, EMBALAGEM]
  VESTIDO: [PCP, ENCAIXE, CORTE, COSTURA, QUAL_COSTURA, ESTAMPARIA_NUCA, QUAL_ESTAMPARIA, REVISAO, EMBALAGEM]
  REGATA:  [PCP, ENCAIXE, CORTE, ESTAMPARIA_NUCA, QUAL_ESTAMPARIA, COSTURA, QUAL_COSTURA, REVISAO, EMBALAGEM]
  PIJAMA:  [PCP, ENCAIXE, CORTE, ENTRETELA, QUAL_ENTRETELA, COSTURA, QUAL_COSTURA, CASEADO_BOTAO, REVISAO, EMBALAGEM]
  CONJUNTO: [PCP, ENCAIXE, CORTE, COSTURA, QUAL_COSTURA, REVISAO, EMBALAGEM]
  CAMISETA: [PCP, ENCAIXE, CORTE, COSTURA, QUAL_COSTURA, ESTAMPARIA_NUCA, QUAL_ESTAMPARIA, REVISAO, EMBALAGEM]

overrides_fases_por_rota:
  REGATA:
    ESTAMPARIA_NUCA: 4

# Keywords para identificar tecido principal no MRP
tecido_principal_keywords:
  - "MALHA"
  - "RIBANA"

# Fase de consumo padrão quando a keyword não encontra correspondência
fase_consumo_default: "CORTE"

# Mapeamento keyword → fase de consumo (usado em engine/insumos.py)
# Keywords mais longas têm prioridade
insumo_fase_consumo:
  "TAG RFID": EMBALAGEM
  "RFID": EMBALAGEM
  "CAIXA": EMBALAGEM
  "PINO": EMBALAGEM
  "ETIQUETA": EMBALAGEM
  "ETIQ": EMBALAGEM
  "HANGTAG": EMBALAGEM
  "SACO": EMBALAGEM
  "EMBALAGEM": EMBALAGEM
  "FITA": CORTE
  "ENTRETELA": CORTE
  "LINHA": COSTURA
  "BOTAO": COSTURA
  "BOTÃO": COSTURA
  "ZIPER": COSTURA
  "ZIPPER": COSTURA
  "ELÁSTICO": COSTURA
  "ELASTICO": COSTURA
  "MALHA": CORTE
  "RIBANA": CORTE
  "TECIDO": CORTE
  "TELA": CORTE

