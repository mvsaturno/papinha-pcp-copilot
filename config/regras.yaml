geral:
  familia_analisada: magazine
  semanas_antes_entrega_cliente: 2   # Entrega interna = semana do cliente − 2
  semanas_autonomia_pcp: 3           # antecipação máxima sem autorização da gestão
  permitir_consumir_margem: true     # semanas entre alvo+1 e semana_cliente−1 → viável c/ ressalva
  estrategia_cronograma: jit         # jit (padrão) | asap (comportamento antigo)
  buffer_producao_pct: 7.0
  arredondamento: half_up          # half_up | ceil | floor
  horizonte_sinalizacao_dias: 90   # >90 dias → badge informativo
  tolerancia_match_qtd_pct: 2.0    # tolerância p/ validação de quantidade no matching

capacidade:
  modo: agregado                   # agregado | por_familia
  limite_total_semana: 80000
  limite_magazine_semana: 70000    # usado quando modo=por_familia
  limite_colecao_semana: 10000
  semanas_ausentes_sao_zero: true

lead_times_estoque_futuro_dias:
  compra: 7
  tecelagem: 7
  pend_tinturaria: 14
  tinturaria: 14

fases_dias:                        # derivado das OFs reais (Mapa SEM 2637) — DRAFT p/ validação
  PCP_MIN: 2                       # tecido já em estoque
  PCP_PADRAO: 21                   # fallback qdo tecido não localizado no MRP
  ENCAIXE: 1
  CORTE: 6
  ENTRETELA: 7
  QUAL_ENTRETELA: 1
  ESTAMPARIA_NUCA: 6
  QUAL_ESTAMPARIA: 1
  COSTURA: 15
  QUAL_COSTURA: 1
  CASEADO_BOTAO: 6
  REVISAO: 8
  EMBALAGEM: 6

rotas:
  DEFAULT: [PCP, ENCAIXE, CORTE, COSTURA, QUAL_COSTURA, ESTAMPARIA_NUCA, QUAL_ESTAMPARIA, REVISAO, EMBALAGEM]
  VESTIDO: [PCP, ENCAIXE, CORTE, COSTURA, QUAL_COSTURA, ESTAMPARIA_NUCA, QUAL_ESTAMPARIA, REVISAO, EMBALAGEM]
  REGATA:  [PCP, ENCAIXE, CORTE, ESTAMPARIA_NUCA, QUAL_ESTAMPARIA, COSTURA, QUAL_COSTURA, REVISAO, EMBALAGEM]
  PIJAMA:  [PCP, ENCAIXE, CORTE, ENTRETELA, QUAL_ENTRETELA, COSTURA, QUAL_COSTURA, CASEADO_BOTAO, REVISAO, EMBALAGEM]

overrides_fases_por_rota:
  REGATA:
    ESTAMPARIA_NUCA: 4
    QUAL_ESTAMPARIA: 3

insumo_fase_consumo:               # keyword (match no início/contido na descrição) → fase
  "ETIQ RFID": COSTURA             # CONFIRMADO pelo gestor
  "RIBANA": CORTE                  # inferido — validar
  "MALHA": CORTE                   # inferido — validar
  "ETIQ": COSTURA                  # inferido — validar
  "TAG": REVISAO                   # inferido — validar
  "PINO": REVISAO                  # inferido — validar
  "CAIXA": EMBALAGEM               # inferido — validar
  "EMBALAGEM": EMBALAGEM           # inferido — validar
  "FITA": EMBALAGEM                # inferido — validar
fase_consumo_default: CORTE        # keyword desconhecida → conservador (trava cedo)

tecido_principal_keywords: [MALHA, RIBANA]

llm:                               # Fase 6 (opcional)
  habilitado: false
  base_url: "https://api.kie.ai/v1"
  modelo: "gemini-2.5-flash"
  timeout_s: 20
