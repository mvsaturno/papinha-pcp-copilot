<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Copiloto PCP Papinha Baby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <!-- Google reCAPTCHA v2 -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    :root {
      --bg: #0b0f1a;
      --surface: #111827;
      --surface2: #1a2236;
      --border: #1e2d45;
      --border2: #2a3f60;
      --text: #e2e8f0;
      --text-muted: #8899bb;
      --accent: #3b82f6;
      --accent-glow: rgba(59,130,246,0.25);
      --red: #ef4444;
      --radius: 12px;
      --radius-sm: 8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    .header {
      text-align: center;
      margin-bottom: 26px;
    }
    .logo {
      font-size: 38px;
      margin-bottom: 8px;
      display: inline-block;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }
    p.subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border2);
      background: var(--surface2);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(59, 130, 246, 0.35);
      transition: all 0.2s;
      margin-top: 6px;
    }
    .btn-submit:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .error-box {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid var(--red);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 18px;
    }
    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="header">
    <div class="logo">🧵</div>
    <h1>Copiloto de Análise PCP</h1>
    <p class="subtitle">Papinha Baby — Acesso Restrito</p>
  </div>

  <div id="error-box" class="error-box"></div>

  <form id="login-form" onsubmit="realizarLogin(event)">
    <div class="form-group">
      <label for="username">Usuário</label>
      <input type="text" id="username" name="username" placeholder="Seu usuário" autocomplete="username" required autofocus />
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" placeholder="Sua senha" autocomplete="current-password" required />
    </div>

    <!-- Google reCAPTCHA v2 -->
    <div style="margin-bottom: 18px; display:flex; justify-content:center;">
      <div class="g-recaptcha" data-sitekey="6LdbRpotAAAAALpenNMdGvaSL2lQXMfp3w-AvJJS"></div>
    </div>

    <button type="submit" id="btn-login" class="btn-submit">
      Entrar no Sistema
    </button>
  </form>

  <div class="footer">
    Ambiente Protegido & Monitorado &bull; Papinha Baby Ltda.
  </div>
</div>

<script>
async function realizarLogin(event) {
  event.preventDefault();
  const errBox = document.getElementById('error-box');
  const btn = document.getElementById('btn-login');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  errBox.style.display = 'none';

  let recaptchaResponse = '';
  if (typeof grecaptcha !== 'undefined') {
    recaptchaResponse = grecaptcha.getResponse();
  }

  if (!recaptchaResponse) {
    errBox.textContent = 'Por favor, marque a caixa de seleção "Não sou um robô".';
    errBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Autenticando...';

  const fd = new FormData();
  fd.append('username', username);
  fd.append('password', password);
  fd.append('g-recaptcha-response', recaptchaResponse);

  try {
    const res = await fetch('/auth/login', { method: 'POST', body: fd });
    const data = await res.json();

    if (res.ok && data.ok) {
      // Redirecionar para a URL solicitada ou página principal
      const urlParams = new URLSearchParams(window.location.search);
      const nextUrl = urlParams.get('next') || '/';
      window.location.href = nextUrl;
    } else {
      errBox.textContent = data.mensagem || 'Credenciais inválidas.';
      errBox.style.display = 'block';
      if (typeof grecaptcha !== 'undefined') {
        grecaptcha.reset();
      }
    }
  } catch (err) {
    errBox.textContent = 'Erro de conexão com o servidor. Tente novamente.';
    errBox.style.display = 'block';
    if (typeof grecaptcha !== 'undefined') {
      grecaptcha.reset();
    }
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar no Sistema';
  }
}
</script>

</body>
</html>
