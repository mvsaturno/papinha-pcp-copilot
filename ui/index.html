<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Copiloto PCP — Papinha Baby</title>
  <meta name="description" content="Ferramenta de análise de PCP — Papinha Baby"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    /* ── Tokens ─────────────────────────────────────────────── */
    :root {
      --bg:        #0b0f1a;
      --surface:   #111827;
      --surface2:  #1a2236;
      --border:    #1e2d45;
      --border2:   #2a3f60;
      --text:      #e2e8f0;
      --text-muted:#8899bb;
      --accent:    #3b82f6;
      --accent-glow: rgba(59,130,246,0.25);
      --green:     #22c55e;
      --green-bg:  rgba(34,197,94,0.12);
      --yellow:    #eab308;
      --yellow-bg: rgba(234,179,8,0.12);
      --red:       #ef4444;
      --red-bg:    rgba(239,68,68,0.12);
      --radius:    12px;
      --radius-sm: 8px;
      --shadow:    0 4px 24px rgba(0,0,0,0.4);
    }

    /* ── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Layout ─────────────────────────────────────────────── */
    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 36px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(139,92,246,0.3);
    }
    .header-text h1 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(90deg, #e2e8f0, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-text p {
      color: var(--text-muted);
      font-size: 13px;
    }
    .badge {
      margin-left: auto;
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 100px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ── Upload Panel ───────────────────────────────────────── */
    .upload-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 24px;
    }
    .upload-panel h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .upload-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .drop-zone {
      border: 2px dashed var(--border2);
      border-radius: var(--radius-sm);
      padding: 20px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      background: var(--bg);
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-glow);
    }
    .drop-zone.file-ok {
      border-color: var(--green);
      background: var(--green-bg);
    }
    .drop-zone.file-err {
      border-color: var(--red);
      background: var(--red-bg);
    }
    .drop-zone input[type="file"] {
      display: none;
    }
    .dz-icon { font-size: 28px; margin-bottom: 8px; display: block; }
    .dz-label {
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
      margin-bottom: 4px;
    }
    .dz-sub {
      font-size: 12px;
      color: var(--text-muted);
    }
    .dz-status {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 500;
      min-height: 18px;
      transition: all 0.2s;
    }
    .dz-status.ok { color: var(--green); }
    .dz-status.err { color: var(--red); }
    .dz-status.loading { color: var(--accent); }

    /* ── Botão Analisar ─────────────────────────────────────── */
    #btn-analisar {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 20px rgba(59,130,246,0.3);
    }
    #btn-analisar:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(59,130,246,0.5);
    }
    #btn-analisar:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Alertas globais ────────────────────────────────────── */
    #alertas-globais {
      display: none;
      background: rgba(234,179,8,0.08);
      border: 1px solid rgba(234,179,8,0.3);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--yellow);
    }
    #alertas-globais.visible { display: block; }

    /* ── Erros de entrada ───────────────────────────────────── */
    #erros-entrada {
      display: none;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--red);
    }
    #erros-entrada.visible { display: block; }

    /* ── Cards de resultado ─────────────────────────────────── */
    #resultados { margin-top: 4px; }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-left: 2px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 14px;
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .card:hover {
      box-shadow: var(--shadow);
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .card-header:hover {
      background: var(--surface2);
    }
    .card.expanded .card-header {
      border-bottom-color: var(--border);
      background: var(--surface2);
    }
    .veredito-badge {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .veredito-badge.VERDE { background: var(--green-bg); color: var(--green); border: 1.5px solid var(--green); }
    .veredito-badge.CANCELADO { background: rgba(156,163,175,0.1); color: #9CA3AF; border: 1.5px solid #9CA3AF; }
    .veredito-badge.AMARELO { background: var(--yellow-bg); color: var(--yellow); border: 1.5px solid var(--yellow); }
    .veredito-badge.VERMELHO { background: var(--red-bg); color: var(--red); border: 1.5px solid var(--red); }

    .card-title {
      flex: 1;
      min-width: 0;
    }
    .card-title strong {
      font-size: 14px;
      font-weight: 600;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-title span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-meta {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-shrink: 0;
    }
    .meta-item {
      text-align: right;
    }
    .meta-item .val {
      font-size: 14px;
      font-weight: 600;
      display: block;
    }
    .meta-item .lbl {
      font-size: 11px;
      color: var(--text-muted);
    }

    .chevron {
      font-size: 14px;
      color: var(--text-muted);
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .card.expanded .chevron { transform: rotate(180deg); }

    /* ── Card body ──────────────────────────────────────────── */
    .card-body {
      display: none;
      padding: 20px;
    }
    .card.expanded .card-body { display: block; }

    .sugestao-box {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 500;
    }
    .sugestao-box.verde { border-color: rgba(34,197,94,0.4); color: var(--green); }
    .sugestao-box.cancelado { border-color: rgba(156,163,175,0.4); color: #9CA3AF; }
    .sugestao-box.vermelho { border-color: rgba(239,68,68,0.4); color: var(--red); }
    .sugestao-box.amarelo { border-color: rgba(234,179,8,0.4); color: var(--yellow); }

    .motivos-list {
      list-style: none;
      margin-bottom: 16px;
    }
    .motivos-list li {
      display: flex;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      padding: 4px 0;
    }
    .motivos-list li::before { content: "•"; color: var(--border2); }

    /* ── Seções internas do card ────────────────────────────── */
    .inner-sections {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    @media (max-width: 700px) { .inner-sections { grid-template-columns: 1fr; } }

    .inner-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
    }
    .inner-box h4 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .inner-box table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .inner-box table td {
      padding: 3px 0;
      vertical-align: top;
    }
    .inner-box table td:first-child {
      color: var(--text-muted);
      width: 50%;
      padding-right: 8px;
    }
    .inner-box table td:last-child {
      font-weight: 500;
    }

    /* ── Insumos ────────────────────────────────────────────── */
    .insumo-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 100px;
      margin-bottom: 4px;
    }
    .tag-ok-estoque { background: var(--green-bg); color: var(--green); }
    .tag-ok-futuro { background: var(--yellow-bg); color: var(--yellow); }
    .tag-falta { background: var(--red-bg); color: var(--red); }
    .tag-bloqueante { background: rgba(239,68,68,0.18); color: var(--red); font-size: 10px; padding: 1px 6px; }

    .insumo-row {
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .insumo-row:last-child { border-bottom: none; }
    .insumo-nome { font-size: 12px; font-weight: 500; margin-bottom: 2px; }
    .insumo-meta { font-size: 11px; color: var(--text-muted); }

    /* ── Cronograma timeline ────────────────────────────────── */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .timeline-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 12px;
    }
    .tl-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: 5px;
      flex-shrink: 0;
    }
    .tl-content { flex: 1; }
    .tl-nome { font-weight: 500; }
    .tl-datas { color: var(--text-muted); font-size: 11px; }

    /* ── Capacidade mini-tabela ─────────────────────────────── */
    .cap-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .cap-row:last-child { border-bottom: none; }
    .cap-row.alvo { background: rgba(59,130,246,0.08); border-radius: 4px; padding: 4px 6px; }
    .cap-situacao { font-size: 11px; font-weight: 600; }
    .cap-ok { color: var(--green); }
    .cap-fail { color: var(--red); }

    /* ── Details brutos ─────────────────────────────────────── */
    details.brutos {
      margin-top: 14px;
    }
    details.brutos summary {
      cursor: pointer;
      font-size: 12px;
      color: var(--text-muted);
      user-select: none;
      padding: 6px 0;
    }
    details.brutos summary:hover { color: var(--text); }
    details.brutos .brutos-content {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-top: 8px;
      font-size: 12px;
      font-family: monospace;
      overflow-x: auto;
      white-space: pre-wrap;
      color: var(--text-muted);
    }

    /* ── Avisos leitura ─────────────────────────────────────── */
    #avisos-leitura {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }
    #avisos-leitura.visible { display: block; }
    #avisos-leitura h3 { font-size: 13px; color: var(--yellow); margin-bottom: 8px; }

    /* ── Tooltip de ajuda ───────────────────────────────────── */
    .hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

    /* ── Empty state ────────────────────────────────────────── */
    #empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    #empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
    #empty-state p { font-size: 14px; }

    /* ── Resumo de semanas (capacidade global) ──────────────── */
    .weeks-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .week-chip {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 100px;
      border: 1px solid var(--border2);
      color: var(--text-muted);
    }
    .week-chip.alvo { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
    .week-chip.sugerida { border-color: var(--green); color: var(--green); background: var(--green-bg); }

    /* ── Transitions ────────────────────────────────────────── */
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="logo">🧵</div>
    <div class="header-text">
      <h1>Copiloto de Análise PCP</h1>
      <p>Papinha Baby</p>
    </div>
    <span class="badge">Sprint 4 — API</span>
  </header>

  <!-- Input Panel -->
  <div class="upload-panel">
    <h2>🔍 Consultar Pedido</h2>
    <p style="color:var(--text-muted); font-size:13px; margin-bottom:16px;">Digite o número do pedido de venda para iniciar a análise completa via API Excia.</p>
    <div style="display:flex;gap:10px;margin:20px 0;align-items:center;">
      <input
        type="text"
        id="input-numero-pedido"
        placeholder="Ex: 105550"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="off"
        style="flex:2; padding: 14px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--bg); color: var(--text); font-size: 18px; font-weight: 600; letter-spacing: 1px; outline: none; transition: border-color 0.2s;"
        onfocus="this.style.borderColor='var(--accent)'"
        onblur="this.style.borderColor='var(--border2)'"
        onkeydown="if(event.key==='Enter') executarAnaliseAPI()"
      >
      <button
        id="btn-analisar-api"
        onclick="executarAnaliseAPI()"
        style="flex:1; padding:14px; background:linear-gradient(135deg,#3b82f6 0%,#8b5cf6 100%); border:none; border-radius:var(--radius-sm); color:#fff; font-size:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 4px 20px rgba(59,130,246,0.3); transition:all 0.2s; white-space:nowrap;"
      >
        <span id="btn-icon-api">⚡</span>
        <span id="btn-text-api">Analisar via API</span>
      </button>
    </div>
    <div id="api-progress" style="display:none; font-size:12px; color:var(--accent); margin-top:-10px; margin-bottom:8px; letter-spacing:0.2px;"></div>
  </div>

  <!-- Resultados -->
  <div id="resultados">
    <div id="empty-state">
      <div class="empty-icon">📈</div>
      <p>Digite o número do Pedido para iniciar a análise.</p>
    </div>

    <div id="erros-entrada"></div>
    <div id="cards-container"></div>
    <div id="alertas-globais" style="margin-top: 20px;"></div>
    <details id="avisos-leitura" class="brutos" style="display:none; margin-bottom: 20px;">
      <summary style="color:var(--yellow); font-size:13px; font-weight:600; cursor:pointer; user-select:none;">⚠️ Avisos de Reconciliação do MRP (Auditoria)</summary>
      <div id="avisos-leitura-corpo" style="margin-top:8px; font-size:12px; color:var(--text-muted); line-height: 1.5;"></div>
    </details>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════
   Estado
══════════════════════════════════════════════════════════ */
const FILES = { pedido: null, mrp: null, capacidade: null };
const STATUS_VALIDO = {};

/* ═══════════════════════════════════════════════════════════
   Drag & Drop
══════════════════════════════════════════════════════════ */
document.querySelectorAll('.drop-zone').forEach(dz => {
  // Clique na drop-zone aciona a abertura do diálogo de arquivo (essencial para celulares)
  dz.addEventListener('click', e => {
    const inp = dz.querySelector('input[type=file]');
    if (inp) inp.click();
  });

  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    const campo = dz.dataset.campo;
    const file = e.dataTransfer.files[0];
    if (file) {
      const inp = dz.querySelector('input[type=file]');
      // Criar um DataTransfer para setar o arquivo no input
      const dt = new DataTransfer();
      dt.items.add(file);
      inp.files = dt.files;
      handleFile(file, campo);
    }
  });
});

function onFileChange(input, campo) {
  if (input.files[0]) handleFile(input.files[0], campo);
}

async function handleFile(file, campo) {
  FILES[campo] = file;
  STATUS_VALIDO[campo] = false;
  setStatus(campo, 'loading', '⏳ Verificando arquivo...');
  setDzClass(campo, '');

  const fd = new FormData();
  fd.append('arquivo', file);

  try {
    const res = await fetch(`/identificar?campo=${encodeURIComponent(campo)}`, { method: 'POST', body: fd });
    const data = await res.json();
    if (data.ok) {
      STATUS_VALIDO[campo] = true;
      setStatus(campo, 'ok', data.mensagem);
      setDzClass(campo, 'file-ok');
    } else {
      setStatus(campo, 'err', data.mensagem);
      setDzClass(campo, 'file-err');
    }
  } catch(e) {
    setStatus(campo, 'err', 'Erro ao verificar arquivo');
    setDzClass(campo, 'file-err');
  }

  atualizarBotao();
}

function setStatus(campo, cls, msg) {
  const el = document.getElementById(`status-${campo}`);
  el.className = `dz-status ${cls}`;
  el.textContent = msg;
}

function setDzClass(campo, cls) {
  const el = document.getElementById(`dz-${campo}`);
  el.className = `drop-zone ${cls}`;
}

function atualizarBotao() {
  const ok = STATUS_VALIDO.pedido && STATUS_VALIDO.mrp && STATUS_VALIDO.capacidade;
  document.getElementById('btn-analisar').disabled = !ok;
}

/* ═══════════════════════════════════════════════════════════
   Análise
══════════════════════════════════════════════════════════ */
async function executarAnaliseAPI() {
  const inputNumero = document.getElementById('input-numero-pedido');
  const btn = document.getElementById('btn-analisar-api');
  const icon = document.getElementById('btn-icon-api');
  const text = document.getElementById('btn-text-api');
  const progress = document.getElementById('api-progress');
  
  const numero = inputNumero.value.trim();
  if (!numero || !/^\d+$/.test(numero)) {
    inputNumero.style.borderColor = 'var(--red)';
    setTimeout(() => inputNumero.style.borderColor = 'var(--border2)', 1500);
    return;
  }

  btn.disabled = true;
  btn.style.opacity = '0.7';
  icon.outerHTML = `<div class="spinner" id="btn-icon-api"></div>`;
  text.textContent = 'Analisando...';
  progress.style.display = 'block';
  
  // Mensagens de progresso para indicar que está trabalhando
  const steps = [
    '⏳ Buscando pedido no Excia...',
    '📦 Verificando OFs vinculadas...',
    '🧵 Carregando ficha técnica dos artigos...',
    '📊 Calculando insumos e capacidade...',
    '✅ Finalizando análise...'
  ];
  let stepIdx = 0;
  progress.textContent = steps[0];
  const progressInterval = setInterval(() => {
    stepIdx = (stepIdx + 1) % steps.length;
    progress.textContent = steps[stepIdx];
  }, 3000);

  const fd = new FormData();
  fd.append('numero_pedido', numero);

  try {
    const res = await fetch('/analisar-pedido', { method: 'POST', body: fd });
    const rawText = await res.text();
    let data;
    try {
      data = JSON.parse(rawText);
    } catch(err) {
      clearInterval(progressInterval);
      progress.style.display = 'none';
      renderErroGeral('Erro de resposta do servidor (HTTP ' + res.status + '): ' + (rawText.slice(0, 150) || 'Falha ao processar resposta.'));
      return;
    }

    clearInterval(progressInterval);
    progress.style.display = 'none';
    renderizar(data);
  } catch(e) {
    clearInterval(progressInterval);
    progress.style.display = 'none';
    renderErroGeral('Erro de comunicação com o servidor: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.style.opacity = '1';
    const iconEl = document.getElementById('btn-icon-api');
    if (iconEl) iconEl.outerHTML = `<span id="btn-icon-api">⚡</span>`;
    document.getElementById('btn-text-api').textContent = 'Analisar via API';
  }
}

async function executarAnaliseDemo() {
  const btn = document.getElementById('btn-demo');
  const btnAnal = document.getElementById('btn-analisar');
  const origText = btn.innerHTML;
  
  btn.disabled = true;
  btnAnal.disabled = true;
  btn.innerHTML = `<span>⏳</span><span>Carregando...</span>`;

  try {
    const res = await fetch('/analisar-demo');
    const data = await res.json();
    
    // Simular que preencheu os status das caixas de upload
    setStatus('pedido', 'ok', '✓ Emissão de Pedido de demonstração carregado');
    setDzClass('pedido', 'file-ok');
    setStatus('mrp', 'ok', '✓ MRP de demonstração carregado');
    setDzClass('mrp', 'file-ok');
    setStatus('capacidade', 'ok', '✓ Resumo de Capacidade de demonstração carregado');
    setDzClass('capacidade', 'file-ok');

}

/* ═══════════════════════════════════════════════════════════
   Renderização
══════════════════════════════════════════════════════════ */
function renderizar(data) {
  document.getElementById('empty-state').style.display = 'none';

  // Erros de entrada
  const elErros = document.getElementById('erros-entrada');
  if (data.erros_entrada && data.erros_entrada.length > 0) {
    elErros.innerHTML = '<strong>❌ Erro na leitura dos arquivos:</strong><br>' +
      data.erros_entrada.map(e => `<div style="margin-top:6px">• <b>[${e.campo}]</b> ${e.mensagem}</div>`).join('');
    elErros.classList.add('visible');
  } else {
    elErros.classList.remove('visible');
  }

  // Alertas globais de capacidade
  const elAlertas = document.getElementById('alertas-globais');
  if (data.alertas_globais && data.alertas_globais.length > 0) {
    elAlertas.innerHTML = '<strong>⚠️ Alertas de Capacidade Geral:</strong><br>' +
      data.alertas_globais.map(a => `<div style="margin-top:4px">${a}</div>`).join('');
    elAlertas.classList.add('visible');
  } else {
    elAlertas.classList.remove('visible');
  }

  // Avisos de leitura (MRP parse_ok=False)
  const elAvisos = document.getElementById('avisos-leitura');
  const elAvisosCorpo = document.getElementById('avisos-leitura-corpo');
  if (data.avisos_leitura && data.avisos_leitura.length > 0) {
    elAvisosCorpo.innerHTML = data.avisos_leitura.map(a => `<div>• ${a}</div>`).join('');
    elAvisos.style.display = 'block';
  } else {
    elAvisos.style.display = 'none';
  }

  // Cards de pedido
  const container = document.getElementById('cards-container');
  container.innerHTML = '';

  if (!data.pedidos || data.pedidos.length === 0) {
    if (!data.erros_entrada?.length) {
      container.innerHTML = '<p style="color:var(--text-muted);font-size:13px;padding:20px 0">Nenhum pedido encontrado na análise.</p>';
    }
    return;
  }

  // Ordenar: VERMELHO → AMARELO → VERDE → CANCELADO
  const ordem = { VERMELHO: 0, AMARELO: 1, VERDE: 2, CANCELADO: 3 };
  const pedidos = [...data.pedidos].sort((a, b) => (ordem[a.veredito] ?? 3) - (ordem[b.veredito] ?? 3));

  container.innerHTML = `<div class="section-title">Resultado da Análise — ${pedidos.length} pedido(s)</div>`;

  pedidos.forEach((p, i) => {
    container.appendChild(criarCard(p, i));
  });
}

function criarCard(p, idx) {
  const div = document.createElement('div');
  div.className = 'card fade-in';
  div.style.animationDelay = `${idx * 0.05}s`;

  const emojiV = { VERDE: '✅', AMARELO: '⚠️', VERMELHO: '❌', CANCELADO: '🚫' };
  const qtdFmt = n => n != null ? n.toLocaleString('pt-BR') : '—';
  const dateFmt = s => {
    if (!s) return '—';
    const [y, m, d] = s.split('-');
    return `${d}/${m}/${y}`;
  };

  // Determinar cor da sugestão
  const sugCls = p.veredito === 'VERDE' ? 'verde' : p.veredito === 'VERMELHO' ? 'vermelho' : p.veredito === 'CANCELADO' ? 'cancelado' : 'amarelo';

  // Cronograma com suporte a múltiplas partes (Superior, Inferior, Acessório, Estampa)
  let timelineHtml = '';
  let partesTabsHtml = '';
  const cronosPartes = (p.cronograma && p.cronograma.cronogramas_partes && Object.keys(p.cronograma.cronogramas_partes).length > 0)
    ? p.cronograma.cronogramas_partes
    : {};
  const chavesPartes = Object.keys(cronosPartes);

  if (chavesPartes.length > 1) {
    partesTabsHtml = `
      <div class="partes-tabs" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;">
        ${chavesPartes.map((pNome, idx) => `
          <button type="button" 
                  class="btn-parte-tab" 
                  onclick="alternarParteTimeline(this, '${p.numero_pedido}', '${pNome}')"
                  style="padding:4px 10px; border-radius:6px; font-size:11px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:${idx === 0 ? 'var(--primary)' : 'var(--surface2)'}; color:${idx === 0 ? '#fff' : 'var(--text)'}">
            ${pNome}
          </button>
        `).join('')}
      </div>
    `;
  }

  if (chavesPartes.length > 0) {
    timelineHtml = chavesPartes.map((pNome, idx) => {
      const fases = cronosPartes[pNome] || [];
      return `
        <div class="timeline-container-parte" data-parte="${pNome}" style="${idx === 0 ? '' : 'display:none;'}">
          ${fases.map(f => `
            <div class="timeline-item">
              <div class="tl-dot"></div>
              <div class="tl-content">
                <div class="tl-nome">${f.nome} <span style="color:var(--text-muted);font-size:11px">(${f.dias}d)</span></div>
                <div class="tl-datas">${dateFmt(f.inicio)} → ${dateFmt(f.fim)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }).join('');
  } else if (p.cronograma && p.cronograma.fases) {
    timelineHtml = p.cronograma.fases.map(f => `
      <div class="timeline-item">
        <div class="tl-dot"></div>
        <div class="tl-content">
          <div class="tl-nome">${f.nome} <span style="color:var(--text-muted);font-size:11px">(${f.dias}d)</span></div>
          <div class="tl-datas">${dateFmt(f.inicio)} → ${dateFmt(f.fim)}</div>
        </div>
      </div>
    `).join('');
  }

  // Capacidade
  let capHtml = '';
  if (p.capacidade && p.capacidade.semanas_relevantes) {
    const minSem = Math.min(...p.capacidade.semanas_relevantes.map(s => s.aass));
    const maxSem = Math.max(...p.capacidade.semanas_relevantes.map(s => s.aass));
    const labelJanela = p.semana_alvo ? `<div style="font-size:12px; font-weight:600; margin-bottom: 8px; color:var(--text)">Janela de autonomia do PCP: semanas ${p.semana_alvo - 3} a ${p.semana_alvo} <span title="Antecipação acima de 3 semanas requer autorização da gestão" style="cursor:help">ℹ️</span></div>` : '';
    
    capHtml = labelJanela + p.capacidade.semanas_relevantes.map(s => {
      const isAlvo = s.aass === p.semana_alvo;
      const isSug = s.aass === p.capacidade.semana_sugerida;
      const isOciosa = s.ociosa; // flag que vira da api na sprint 2
      const cls = s.mais_este <= s.limite ? 'cap-ok' : 'cap-fail';
      return `<div class="cap-row ${isAlvo ? 'alvo' : ''}">
        <span>Sem. ${s.aass}${isAlvo ? ' ★' : ''}${isSug ? (isOciosa ? '' : ' 💡') : ''}${isOciosa ? ' 💡 ociosa' : ''}</span>
        <span>${qtdFmt(s.pend_atual)} → <b>${qtdFmt(s.mais_este)}</b></span>
        <span class="cap-situacao ${cls}">${s.mais_este <= s.limite ? '✓ OK' : '✗ Cheio'}</span>
      </div>`;
    }).join('');
  }

  // Insumos
  let insHtml = '';
  if (p.insumos && p.insumos.length > 0) {
    insHtml = p.insumos.map(ins => {
      const statusCls = ins.status === 'OK_ESTOQUE' ? 'tag-ok-estoque' :
                        ins.status === 'OK_FUTURO' ? 'tag-ok-futuro' : 'tag-falta';
      const statusLabel = ins.status === 'OK_ESTOQUE' ? '✓ Estoque' :
                          ins.status === 'OK_FUTURO' ? '⏳ A caminho' : '✗ FALTA';
      const dispStr = ins.disponivel_em ? ` — disponível ${dateFmt(ins.disponivel_em)}` : '';
      const bloqStr = ins.bloqueante ? `<span class="insumo-tag tag-bloqueante">BLOQUEANTE</span>` : '';
      const divCor = ins.cor_divergente ? `<span class="insumo-tag" style="background:var(--red-dim);color:var(--red);border-color:var(--red);font-weight:600">⚠️ Cor Divergente (${ins.nome_cor})</span>` : '';
      return `<div class="insumo-row">
        <div class="insumo-nome">${ins.descricao || ins.cod_insumo}</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:3px">
          <span class="insumo-tag ${statusCls}">${statusLabel}${dispStr}</span>
          ${bloqStr}
          ${divCor}
          <span class="insumo-tag" style="background:var(--surface2);color:var(--text-muted)">Fase: ${ins.fase_consumo}</span>
        </div>
        <div class="insumo-meta">Necessário: ${qtdFmt(ins.necessario)} | Estoque: ${qtdFmt(ins.aloc_estoque)}</div>
      </div>`;
    }).join('');
  } else {
    insHtml = '<div style="color:var(--text-muted);font-size:12px">Nenhum insumo encontrado no MRP para este artigo.</div>';
  }

  // Motivos
  const motivosHtml = p.motivos && p.motivos.length > 0
    ? `<ul class="motivos-list">${p.motivos.map(m => `<li>${m}</li>`).join('')}</ul>`
    : '';

  // Dados brutos
  const brutosJson = JSON.stringify(p.dados_brutos || {}, null, 2);

  // Header com badge de OF emitida vs Simulação Pré-OF
  const ofBadgeHtml = p.of_emitida && p.numero_of
    ? `<span style="background:rgba(59,130,246,0.15);color:#60A5FA;border:1px solid rgba(59,130,246,0.4);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700;letter-spacing:0.4px">🏷️ OF ${p.numero_of} (SEM. ${p.semana_of_oficial || p.semana_alvo})</span>`
    : `<span style="background:rgba(234,179,8,0.12);color:#FBBF24;border:1px solid rgba(234,179,8,0.3);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600">💡 SIMULAÇÃO PRÉ-OF</span>`;

  div.innerHTML = `
    <div class="card-header" onclick="toggleCard(this.closest('.card'))">
      <div class="veredito-badge ${p.veredito}">${emojiV[p.veredito] || '?'}</div>
      <div class="card-title">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
          <strong>Pedido ${p.numero_pedido} — ${p.descricao}</strong>
          ${ofBadgeHtml}
        </div>
        <span>Artigo ${p.artigo} | Cor ${p.cod_cor} ${p.nome_cor}</span>
      </div>
      <div class="card-meta">
        <div class="meta-item">
          <span class="val">${dateFmt(p.entrega_cliente ? p.entrega_cliente.split ? p.entrega_cliente : null : null)}</span>
          <span class="lbl">Entrega Cliente</span>
        </div>
        <div class="meta-item">
          <span class="val">${p.of_emitida && (p.qtde_of_oficial || p.qtd_of) ? qtdFmt(p.qtde_of_oficial || p.qtd_of) : (p.qtd_of || qtdFmt(p.qtde_pedido))}</span>
          <span class="lbl">
            ${p.of_emitida ? 'Peças na OF' : 'Peças a Produzir'}
            <br/><span style="font-size: 0.78em; color: #60A5FA; font-weight: 500;">✓ Inclui quebra</span>
            ${p.qtde_pedido && (p.qtde_pedido !== (p.qtde_of_oficial || p.qtd_of)) ? `<br/><span style="font-size: 0.78em; color: var(--text-muted);">(${qtdFmt(p.qtde_pedido)} pedidas)</span>` : ''}
            ${p.qtde_faturada > 0 ? `<br/><span style="font-size: 0.8em; color: var(--green);">${qtdFmt(p.qtde_faturada)} entregues</span>` : ''}
          </span>
        </div>
        <div class="meta-item">
          <span class="val" style="color:${p.veredito==='VERDE'?'var(--green)':p.veredito==='AMARELO'?'var(--yellow)':p.veredito==='CANCELADO'?'#9CA3AF':'var(--red)'}">
            ${p.of_emitida && p.semana_of_oficial ? `Sem. ${p.semana_of_oficial}` : `Sem. ${p.semana_alvo}`}
          </span>
          <span class="lbl">${p.of_emitida ? 'Semana da OF' : 'Semana Alvo'}</span>
        </div>
      </div>
      <span class="chevron">▼</span>
    </div>
    <div class="card-body">
      <div class="sugestao-box ${sugCls}">${p.sugestao || '—'}</div>
      ${motivosHtml}
      <div class="inner-sections">
        <div class="inner-box">
          <h4>📅 Cronograma ${p.of_emitida ? 'Oficial da OF' : 'Draft'}</h4>
          ${partesTabsHtml}
          <div class="timeline">${timelineHtml || '<span style="color:var(--text-muted);font-size:12px">Não disponível</span>'}</div>
          ${p.cronograma ? `<div style="margin-top:8px;font-size:11px;color:var(--text-muted)">Rota: ${p.cronograma.rota_detectada} | OF: ${qtdFmt(p.qtd_of)} peças (c/ buffer)</div>` : ''}
        </div>
        <div class="inner-box">
          <h4>📊 Capacidade Semanal</h4>
          ${capHtml || '<span style="color:var(--text-muted);font-size:12px">Não disponível</span>'}
          <div style="margin-top:8px;font-size:11px;color:var(--text-muted);display:flex;flex-direction:column;gap:3px">
            ${p.capacidade && p.capacidade.semana_sugerida ? `<div>💡 <b>Semana Sugerida:</b> Produzir na semana ${p.capacidade.semana_sugerida} (capacidade OK)</div>` : ''}
            <div>★ <b>Semana Alvo:</b> ${p.of_emitida ? 'Semana gravada na OF no Excia' : 'entrega interna planejada (semana solicitada pelo cliente − 2)'}</div>
          </div>
        </div>
      </div>
      <div class="inner-box" style="margin-bottom:14px">
        <h4>🧵 Insumos</h4>
        ${insHtml}
      </div>
      <details class="brutos">
        <summary>🔍 Dados brutos (auditoria)</summary>
        <div class="brutos-content">${brutosJson}</div>
      </details>
    </div>
  `;

  return div;
}

function alternarParteTimeline(btn, numPed, pNome) {
  const container = btn.closest('.inner-box');
  if (!container) return;
  const tabs = container.querySelectorAll('.btn-parte-tab');
  tabs.forEach(t => {
    t.style.background = 'var(--surface2)';
    t.style.color = 'var(--text)';
  });
  btn.style.background = 'var(--primary)';
  btn.style.color = '#fff';

  const tls = container.querySelectorAll('.timeline-container-parte');
  tls.forEach(tl => {
    if (tl.getAttribute('data-parte') === pNome) {
      tl.style.display = 'block';
    } else {
      tl.style.display = 'none';
    }
  });
}

function toggleCard(card) {
  card.classList.toggle('expanded');
}

function renderErroGeral(msg) {
  const el = document.getElementById('erros-entrada');
  el.innerHTML = `<strong>❌ ${msg}</strong>`;
  el.classList.add('visible');
  document.getElementById('empty-state').style.display = 'none';
}

/* ═══════════════════════════════════════════════════════════
   Data de entrega: corrigir formato ISO
══════════════════════════════════════════════════════════ */
function fmtDataISO(val) {
  if (!val) return '—';
  if (typeof val === 'string' && val.match(/^\d{4}-\d{2}-\d{2}/)) {
    const [y, m, d] = val.split('T')[0].split('-');
    return `${d}/${m}/${y}`;
  }
  return val;
}
// Patch criarCard para usar fmtDataISO corretamente
// (entrega_cliente já é string ISO do servidor)
const _origCriarCard = criarCard;
window.criarCard = function(p, idx) {
  p._entregaFmt = fmtDataISO(p.entrega_cliente);
  return _origCriarCard(p, idx);
};
